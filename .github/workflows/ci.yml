name: CI (Windows only)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
          pip install flake8

      - name: Lint
        shell: pwsh
        run: |
          flake8 core ui --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 core ui --count --exit-zero --max-complexity=20 --max-line-length=100 --statistics

  build:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
          pip install pyinstaller

      - name: Build (PyInstaller onedir)
        shell: pwsh
        run: |
          pyinstaller .\main.py `
            --noconsole --onedir --name AnchorPass `
            --icon ".\assets\icon.ico" `
            --clean `
            --collect-all cryptography `
            --exclude-module PySide6.QtWebEngineCore `
            --exclude-module PySide6.QtWebEngineWidgets `
            --exclude-module PySide6.QtWebEngineQuick `
            --exclude-module PySide6.QtMultimedia `
            --exclude-module PySide6.QtMultimediaWidgets `
            --exclude-module PySide6.QtNetwork `
            --exclude-module PySide6.QtPrintSupport `
            --exclude-module PySide6.Qt3DAnimation `
            --exclude-module PySide6.Qt3DCore `
            --exclude-module PySide6.Qt3DExtras `
            --exclude-module PySide6.Qt3DInput `
            --exclude-module PySide6.Qt3DLogic `
            --exclude-module PySide6.Qt3DRender `
            --exclude-module PySide6.QtAxContainer `
            --exclude-module PySide6.QtBluetooth `
            --exclude-module PySide6.QtCharts `
            --exclude-module PySide6.QtDataVisualization `
            --exclude-module PySide6.QtGraphs `
            --exclude-module PySide6.QtGraphsWidgets `
            --exclude-module PySide6.QtHelp `
            --exclude-module PySide6.QtNetworkAuth `
            --exclude-module PySide6.QtNfc `
            --exclude-module PySide6.QtPositioning `
            --exclude-module PySide6.QtQuick `
            --exclude-module PySide6.QtQuick3D `
            --exclude-module PySide6.QtQuickControls2 `
            --exclude-module PySide6.QtQuickTest `
            --exclude-module PySide6.QtQuickWidgets `
            --exclude-module PySide6.QtRemoteObjects `
            --exclude-module PySide6.QtScxml `
            --exclude-module PySide6.QtSensors `
            --exclude-module PySide6.QtSerialPort `
            --exclude-module PySide6.QtSerialBus `
            --exclude-module PySide6.QtSpatialAudio `
            --exclude-module PySide6.QtStateMachine `
            --exclude-module PySide6.QtTextToSpeech `
            --exclude-module PySide6.QtVirtualKeyboard `
            --exclude-module PySide6.QtWebChannel `
            --exclude-module PySide6.QtWebSockets `
            --exclude-module PySide6.QtPdf `
            --exclude-module PySide6.QtPdfWidgets `
            --exclude-module PySide6.QtHttpServer `
            --exclude-module PySide6.QtLocation `
            --exclude-module PySide6.QtAsyncio `
            --exclude-module PySide6.QtWebView `
            --exclude-module PySide6.QtConcurrent `
            --exclude-module PySide6.QtDBus `
            --exclude-module PySide6.QtDesigner `
            --exclude-module PySide6.QtOpenGL `
            --exclude-module PySide6.QtOpenGLWidgets `
            --exclude-module PySide6.QtQml `
            --exclude-module PySide6.QtXml `
            --exclude-module PySide6.QtTest `
            --exclude-module PySide6.QtSql `
            --exclude-module PySide6.QtSvg `
            --exclude-module PySide6.QtSvgWidgets `
            --exclude-module PySide6.QtUiTools `
            --add-data "styles;styles" `
            --add-data "assets;assets" `
            --add-data ".\LICENSE.md;." `
            --add-data ".\THIRD_PARTY_NOTICES.md;." `
            --add-data ".\CREDITS.md;."

      # NEW: make zip, same as before
      - name: Package onedir build as zip
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $outDir = "dist/AnchorPass"
          $zipPath = "dist/AnchorPass-win-x64-$version.zip"
          Compress-Archive -Path "$outDir\*" -DestinationPath $zipPath -Force

      # NEW: install Inno Setup and build installer
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DAppVersion=$version `
            ".\installer.iss"

      # UPDATED: upload both zip + installer exe
      - name: Upload artifact (zip + installer)
        uses: actions/upload-artifact@v4
        with:
          name: spm-win-x64-${{ github.ref_name }}
          path: |
            dist/AnchorPass-win-x64-${{ github.ref_name }}.zip
            dist/AnchorPass-Setup-${{ github.ref_name }}.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built artifact
        uses: actions/download-artifact@v4
        with:
          name: spm-win-x64-${{ github.ref_name }}
          path: build_out

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build_out/AnchorPass-win-x64-${{ github.ref_name }}.zip
            build_out/AnchorPass-Setup-${{ github.ref_name }}.exe
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
