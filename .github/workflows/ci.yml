name: CI (Windows only)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
          pip install flake8

      - name: Lint
        shell: pwsh
        run: |
          flake8 core ui --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 core ui --count --exit-zero --max-complexity=20 --max-line-length=100 --statistics