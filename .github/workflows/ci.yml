name: CI (Windows only)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
          pip install flake8

      - name: Lint
        shell: pwsh
        run: |
          flake8 core ui --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 core ui --count --exit-zero --max-complexity=20 --max-line-length=100 --statistics

  build:
    # Build ONLY on tag pushes (refs/tags/…)
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
          pip install pyinstaller

      - name: Build (PyInstaller onedir)
        shell: pwsh
        run: |
          pyinstaller .\main.py `
            --noconsole --onedir --name AnchorPass `
            --icon ".\assets\icon.ico" `
            --clean `
            --collect-all cryptography `
            --exclude-module PySide6.QtWebEngineCore `
            --exclude-module PySide6.QtWebEngineWidgets `
            --exclude-module PySide6.QtWebEngineQuick `
            --exclude-module PySide6.QtMultimedia `
            --exclude-module PySide6.QtMultimediaWidgets `
            --exclude-module PySide6.QtNetwork `
            --exclude-module PySide6.QtPrintSupport `
            --add-data "styles;styles" `
            --add-data "assets;assets"

      - name: Package onedir build as zip
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $outDir = "dist/AnchorPass"
          $zipPath = "dist/AnchorPass-win-x64-$version.zip"
          Compress-Archive -Path "$outDir\*" -DestinationPath $zipPath -Force

      - name: Upload artifact (zip)
        uses: actions/upload-artifact@v4
        with:
          name: spm-win-x64-${{ github.ref_name }}
          path: dist/AnchorPass-win-x64-${{ github.ref_name }}.zip
          if-no-files-found: error

  release:
    # Create a GitHub Release ONLY on tag pushes
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built artifact
        uses: actions/download-artifact@v4
        with:
          name: spm-win-x64-${{ github.ref_name }}
          path: build_out

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build_out/AnchorPass-win-x64-${{ github.ref_name }}.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
