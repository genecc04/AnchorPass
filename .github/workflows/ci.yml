name: CI (Windows only)

on:
  push:
    branches: [ main, master ]   # lint on branch pushes
    tags: [ 'v*' ]               # also trigger on tags like v1.2.0 or v1.2.0-alpha
  pull_request:
    branches: [ main, master ]   # lint on PRs
  workflow_dispatch:              # optional manual trigger

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
          pip install flake8

      - name: Lint
        shell: pwsh
        run: |
          flake8 core ui --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 core ui --count --exit-zero --max-complexity=20 --max-line-length=100 --statistics

  build:
    # Build ONLY on tag pushes (refs/tags/…)
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
          pip install pyinstaller

      - name: Build (PyInstaller)
        shell: pwsh
        run: |
          pyinstaller .\main.py `
            --noconsole --onefile --name SecurePasswordManager `
            --icon ".\assets\icon.ico" `
            --clean `
            --collect-all PySide6 `
            --collect-all cryptography `
            --add-data "styles;styles" `
            --add-data "assets;assets"

      - name: Upload artifact (exe)
        uses: actions/upload-artifact@v4
        with:
          name: spm-win-x64-${{ github.ref_name }}
          path: dist/SecurePasswordManager.exe
          if-no-files-found: error

  release:
    # Create a GitHub Release ONLY on tag pushes
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built artifact
        uses: actions/download-artifact@v4
        with:
          name: spm-win-x64-${{ github.ref_name }}
          path: build_out

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build_out/SecurePasswordManager.exe
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
